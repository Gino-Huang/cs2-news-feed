name: CS2 News Feed

on:
  schedule:
    # 08:00 and 20:00 CST daily
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate RSS feed
        run: python3 generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update cs2 news feed"
          # squash to single commit so image history never bloats the repo
          NEW_SHA=$(git commit-tree HEAD^{tree} -m "cs2 news feed")
          git reset --hard $NEW_SHA
          git push -f origin main


      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/Gino-Huang/cs2-news-feed@main/feed.xml" || true
